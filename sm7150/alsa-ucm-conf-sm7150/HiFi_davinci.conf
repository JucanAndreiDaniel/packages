# UCM for Xiaomi Mi 9T / Redmi K20 (davinci, SM7150).
#
# Sound card uses the qcom,sm8250-sndcard driver with model "Xiaomi Mi 9T".
# Speaker path (from sm7150-xiaomi-davinci.dts):
#   MultiMedia1 -> PRIMARY_MI2S_RX -> NXP TFA9874 amp.
#
# TODO(bring-up): verify kcontrol names with `amixer controls` on the
# device and adjust EnableSequence. The card-name symlinks in the spec
# must match /proc/asound/cards; print it on first boot and fix.
Syntax 3
SectionVerb {
 EnableSequence [ cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1" ]
 DisableSequence [ cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0" ]
 Value { TQ "HiFi"
 }}
SectionDevice."Speaker" {
 Comment "Speaker playback"
 Value { PlaybackPriority 200
  PlaybackPCM "hw:${CardId},0" }
}
